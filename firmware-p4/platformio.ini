; PersonalAIBot - ESP32-P4 firmware (Guition JC4880P443C_I_W): its own project, separate from the ES3C28P (ESP32-S3)
; firmware in ../ - build from the repo root with `pio run -d firmware-p4` (or from this folder: `pio run`)
; Board: JC-ESP32P4-M3 module (ESP32-P4 RISC-V 2 cores, 32 MB PSRAM, 16 MB flash) + ESP32-C6 (Wi-Fi 6 / BLE 5 over
; ESP-Hosted SDIO), 4.3" 480x800 ST7701S MIPI-DSI, GT911 touch, ES8311 + NS4150B, OV02C10 MIPI-CSI camera, RS485
; See ../wiki/19-ESP32-P4-JC4880P443C.md
;
; Pick the env for the chip revision (the boot log prints it; an image for the other one does not start):
;   esp32p4-r3 = ESP32-P4 rev 3.x (V3 boards, 400 MHz) - the default
;   esp32p4    = ESP32-P4 engineering sample, before rev 3.0 (V1 / V2 boards, 360 MHz)

[platformio]
default_envs = esp32p4-r3

[env:esp32p4]
; same pinned pioarduino release as the ESP32-S3 firmware (Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-p4
framework = arduino

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; 2 x 6 MB app (OTA) + 3.25 MB ESP-SR "model" + 640 KB LittleFS (memory goes to the SD card)
board_build.partitions = partitions_p4.csv
board_build.filesystem = littlefs

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DBOARD_JC4880P443C=1
    -DARDUINO_USB_MODE=1            ; console on the P4's USB-Serial-JTAG (ESP32-AI Studio) - check on the board
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I include
    ; OBD over Bluetooth LE through the ESP32-C6 (ESP-Hosted HCI): NimBLE host pools in PSRAM
    -DVEHICLE_BLE=1
    -Wl,--wrap=nimble_mem_malloc
    -Wl,--wrap=nimble_mem_calloc
    -Wl,--wrap=nimble_mem_free

extra_scripts =
    pre:../tools/pio_strip_paths.py   ; no absolute build paths inside the firmware
    post:../tools/pio_sr_model.py     ; the ESP32-P4 ESP-SR models -> "model" partition on every USB upload

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_extra_dirs = ../lib                ; Helix MP3 / AAC (RPSL) shared with the ESP32-S3 firmware
lib_deps =
    lovyan03/LovyanGFX @ 1.2.33
    bblanchon/ArduinoJson @ 7.4.3
    adafruit/Adafruit NeoPixel @ 1.15.5

[env:esp32p4-r3]
extends = env:esp32p4
board = esp32-p4_r3

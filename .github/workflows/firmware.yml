# MANUAL ONLY: GitHub Actions cannot run on this account (locked for billing), so releases are published
# from a PC with `python tools/publish_release.py` (draft -> upload -> publish, immutable releases).
# This workflow is kept for when Actions works again: Actions -> Firmware -> Run workflow builds the
# image and, if FIRMWARE_VERSION has no tag yet, publishes it the same way.
#   To make it automatic again, add:   push: { branches: [main] }   under "on:".
name: Firmware

on:
  workflow_dispatch:

permissions:
  contents: write  # create tags / releases

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    needs: host-tests  # never publish an image whose tests fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, to know whether this version was released already

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + esptool
        run: pip install --upgrade platformio esptool cryptography

      - name: Read firmware version
        id: ver
        run: |
          v=$(sed -nE 's/^#define[[:space:]]+FIRMWARE_VERSION[[:space:]]+"([^"]+)".*/\1/p' src/app/AppConfig.h)
          test -n "$v" || { echo "FIRMWARE_VERSION not found"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Firmware $v (already released: $(git rev-parse -q --verify "refs/tags/v$v" >/dev/null && echo yes || echo no))"

      # With a release key in src/app/OtaPublicKey.h the -app.bin must be signed: the private key comes from
      # the repository secret OTA_SIGNING_KEY (PEM). Without the secret, make_release.py stops (T074).
      - name: Build factory image (refuses secrets, scans the image, signs the app)
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          if [ -n "$OTA_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$OTA_SIGNING_KEY" > "$RUNNER_TEMP/ota_signing_key.pem"
            export PAB_OTA_SIGNING_KEY="$RUNNER_TEMP/ota_signing_key.pem"
          fi
          python tools/make_release.py
          rm -f "$RUNNER_TEMP/ota_signing_key.pem"

      - name: Keep the image as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAIBot-ESP32-v${{ steps.ver.outputs.version }}
          path: dist/*

      # This repository uses immutable releases: assets can only be attached while the release is a
      # draft, and a tag that belonged to a published release can never be reused. So: draft -> upload
      # -> publish, and only for versions without a tag (bump FIRMWARE_VERSION for every release).
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && steps.ver.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "## Flash it / แฟลชลงบอร์ด"
            echo "1. Download **PersonalAIBot-ESP32-v${VER}-factory.bin** below. / ดาวน์โหลดไฟล์ด้านล่าง"
            echo "2. Open https://espressif.github.io/esptool-js/ in Chrome or Edge → **Connect** (not found? hold BOOT, tap RESET, release BOOT)."
            echo "   เปิดเว็บด้วย Chrome/Edge → Connect (หาไม่เจอ: กด BOOT ค้าง แตะ RESET แล้วปล่อย BOOT)"
            echo "3. Flash address **0x0** → choose the file → **Program** → press RESET."
            echo "4. Enter your own Wi-Fi + Gemini API key on the device — or put \`ai-setup.txt\` on the SD card ([template](https://github.com/${REPO}/blob/main/tools/sd_card/ai-setup.txt))."
            echo "   ใส่ Wi-Fi + Gemini API key ของคุณบนบอร์ด หรือวาง \`ai-setup.txt\` ไว้ในการ์ด SD"
            echo
            echo "> The factory image starts at 0x0 and resets saved settings. To update and keep them, build from source (\`pio run -t upload\`)."
            echo "> ไฟล์ factory ล้างค่าตั้งค่าเดิม ถ้าต้องการอัปเดตโดยเก็บค่าเดิมให้ build จากซอร์ส"
            echo ">"
            echo "> No passwords or API keys are included in this image. / ไฟล์นี้ไม่มีรหัสหรือ API key ใดๆ"
          } > release-notes.md
          gh release create "v${VER}" --repo "$REPO" --target "$GITHUB_SHA" --draft \
            --title "PersonalAIBot-ESP32 v${VER}" --notes-file release-notes.md --generate-notes
          gh release upload "v${VER}" dist/* --repo "$REPO"
          gh release edit "v${VER}" --repo "$REPO" --draft=false --latest

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Fetch ArduinoJson (PlatformIO library)
        run: |
          pip install --upgrade platformio
          pio pkg install -e esp32s3
      - name: Host unit tests
        run: bash host_tests/run_tests.sh

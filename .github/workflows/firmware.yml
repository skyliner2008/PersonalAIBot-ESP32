# Build the firmware on every push / pull request. When FIRMWARE_VERSION in src/app/AppConfig.h is a
# version that has no "v<version>" tag yet, publish a GitHub Release with the factory image attached.
#
#   Release a new version:  bump FIRMWARE_VERSION -> commit -> git push        (that's all)
#   Re-upload the current one: Actions -> Firmware -> Run workflow
name: Firmware

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - "tools/make_release.py"
      - "tools/pio_strip_paths.py"
      - "host_tests/**"
      - ".github/workflows/firmware.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # create tags / releases

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, to know whether this version was released already

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO + esptool
        run: pip install --upgrade platformio esptool

      - name: Read firmware version
        id: ver
        run: |
          v=$(sed -nE 's/^#define[[:space:]]+FIRMWARE_VERSION[[:space:]]+"([^"]+)".*/\1/p' src/app/AppConfig.h)
          test -n "$v" || { echo "FIRMWARE_VERSION not found"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Firmware $v (already released: $(git rev-parse -q --verify "refs/tags/v$v" >/dev/null && echo yes || echo no))"

      - name: Build factory image (refuses secrets, scans the image)
        run: python tools/make_release.py

      - name: Keep the image as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAIBot-ESP32-v${{ steps.ver.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (steps.ver.outputs.released == 'false' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PersonalAIBot-ESP32 v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Flash it / แฟลชลงบอร์ด
            1. Download **PersonalAIBot-ESP32-v${{ steps.ver.outputs.version }}-factory.bin** below. / ดาวน์โหลดไฟล์ด้านล่าง
            2. Open https://espressif.github.io/esptool-js/ in Chrome or Edge → **Connect** (not found? hold BOOT, tap RESET, release BOOT).
               เปิดเว็บด้วย Chrome/Edge → Connect (หาไม่เจอ: กด BOOT ค้าง แตะ RESET แล้วปล่อย BOOT)
            3. Flash address **0x0** → choose the file → **Program** → press RESET.
            4. Enter your own Wi-Fi + Gemini API key on the device — or put `ai-setup.txt` on the SD card ([template](https://github.com/${{ github.repository }}/blob/main/tools/sd_card/ai-setup.txt)).
               ใส่ Wi-Fi + Gemini API key ของคุณบนบอร์ด หรือวาง `ai-setup.txt` ไว้ในการ์ด SD

            > The factory image starts at 0x0 and resets saved settings. To update and keep them, build from source (`pio run -t upload`).
            > ไฟล์ factory ล้างค่าตั้งค่าเดิม ถ้าต้องการอัปเดตโดยเก็บค่าเดิมให้ build จากซอร์ส
            >
            > No passwords or API keys are included in this image. / ไฟล์นี้ไม่มีรหัสหรือ API key ใดๆ

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Fetch ArduinoJson (PlatformIO library)
        run: |
          pip install --upgrade platformio
          pio pkg install -e esp32s3
      - name: Host unit tests
        run: bash host_tests/run_tests.sh

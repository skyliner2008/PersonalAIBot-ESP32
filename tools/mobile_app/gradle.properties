#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
kotlin.native.ignoreDisabledTargets=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# idle daemon (~2.8 GB "OpenJDK Platform binary") exits after 15 min instead of Gradle's default 3 h;
# the Kotlin daemon follows once its Gradle client is gone
org.gradle.daemon.idletimeout=900000

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# JVM provisioning is handled by gradle/gradle-daemon-jvm.properties (toolchainVersion=21)

#App version (composeApp + the esp32 module) - tools/build_mobile_apk.py reads it
mobileVersionName=2.1.0
mobileVersionCode=4

; ESP32-AI Personal Agent v2 — PlatformIO Configuration
; Board: ES3C28P (ESP32-S3-N16R8 + ILI9341V + ES8311 + FT6336G)
; See wiki/03-Libraries-and-Dependencies.md for details

[env:esp32s3]
; Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5 (pioarduino: the official platform stops at 2.0.17 / IDF 4.4,
; which has no ESP-SR - wiki 14). Pinned release; was: espressif32 @ 7.1.3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- Memory Configuration for N16R8 ---
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; 2 x 5 MB app (OTA) + 3.25 MB "model" (ESP-SR wake word, flashed by tools/pio_sr_model.py) + 2.6 MB
; "spiffs" partition used as LittleFS (long-term memory fallback when no SD card is inserted).
; nvs/otadata at the same offsets as default_16MB.csv (was: 2 x 6.25 MB app + 3.4 MB LittleFS)
board_build.partitions = partitions_sr.csv
board_build.filesystem = littlefs

; --- Build Flags ---
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1     ; the Type-C port is the S3 native USB (VID 303A)
    -I include

extra_scripts =
    pre:tools/pio_strip_paths.py   ; no absolute build paths (user name) inside the firmware
    post:tools/pio_sr_model.py     ; srmodels.bin -> "model" partition on every USB upload

; --- Serial Monitor ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Upload ---
upload_speed = 921600

; --- Library Dependencies (pinned for reproducible builds) ---
; Gemini WebSocket: ESP-IDF esp_websocket_client (built into the framework)
lib_deps =
    lovyan03/LovyanGFX @ 1.2.33
    bblanchon/ArduinoJson @ 7.4.3
    adafruit/Adafruit NeoPixel @ 1.15.5

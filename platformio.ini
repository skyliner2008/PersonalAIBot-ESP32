; ESP32-AI Personal Agent v2 — PlatformIO Configuration
; Board: ES3C28P (ESP32-S3-N16R8 + ILI9341V + ES8311 + FT6336G)
; See wiki/03-Libraries-and-Dependencies.md for details

[env:esp32s3]
platform = espressif32 @ 7.1.3          ; Arduino-ESP32 2.0.17 (ESP-IDF 4.4)
board = esp32-s3-devkitc-1
framework = arduino

; --- Memory Configuration for N16R8 ---
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; 2 x 6.25 MB app (OTA-ready) + 3.4 MB "spiffs" partition used as LittleFS
; (long-term memory fallback when no SD card is inserted)
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; --- Build Flags ---
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1     ; the Type-C port is the S3 native USB (VID 303A)
    -I include

extra_scripts = pre:tools/pio_strip_paths.py   ; no absolute build paths (user name) inside the firmware

; --- Serial Monitor ---
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; --- Upload ---
upload_speed = 921600

; --- Library Dependencies (pinned for reproducible builds) ---
; Gemini WebSocket: ESP-IDF esp_websocket_client (built into the framework)
lib_deps =
    lovyan03/LovyanGFX @ 1.2.33
    bblanchon/ArduinoJson @ 7.4.3
    adafruit/Adafruit NeoPixel @ 1.15.5
